</head>

<body>

<header>
    <h1>🕹️ Omar's DOS Games</h1>
    <p>Select a game to start DOSBox.</p>
</header>

<div id="loading">
    Loading games...
</div>

<div id="games"></div>

<div id="player">
    <button id="close">✕ Close</button>
    <div id="dos"></div>
</div>

<script>
    /*
     * Add your .jsdos games here.
     *
     * Example:
     *
     * {
     *     name: "Doom",
     *     file: "doom.jsdos"
     * }
     */

    const games = [
        {
            name: "DOOM",
            file: "doom.jsdos"
        },

        {
            name: "Wolfenstein 3D",
            file: "wolf3d.jsdos"
        },

        {
            name: "Prince of Persia",
            file: "prince.jsdos"
        }
    ];


    const gamesContainer = document.getElementById("games");
    const loading = document.getElementById("loading");

    const player = document.getElementById("player");
    const dos = document.getElementById("dos");
    const closeButton = document.getElementById("close");


    function showGames() {
        loading.style.display = "none";

        gamesContainer.innerHTML = "";

        if (games.length === 0) {
            gamesContainer.innerHTML =
                "<p>No DOS games have been added yet.</p>";

            return;
        }

        games.forEach(game => {
            const card = document.createElement("div");

            card.className = "game";

            card.innerHTML = `
                <h2>🕹️ ${game.name}</h2>
                <p>${game.file}</p>
            `;

            card.addEventListener("click", () => {
                launchGame(game.file);
            });

            gamesContainer.appendChild(card);
        });
    }


    function launchGame(file) {
        player.style.display = "block";

        dos.innerHTML = "";

        /*
         * Start js-dos using the selected .jsdos bundle.
         */
        Dos(dos, {
            url: "jsdos/" + file
        });
    }


    closeButton.addEventListener("click", () => {
        /*
         * Reloading the player area stops the current emulator.
         */
        dos.innerHTML = "";

        player.style.display = "none";
    });


    showGames();
</script>

</body>
</html>
